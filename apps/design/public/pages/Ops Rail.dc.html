<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../_ds/cosx-design-system-3-0-460d0b48-000f-4361-83ff-f80b93c83c2c/styles.css">
  <script src="../_ds/cosx-design-system-3-0-460d0b48-000f-4361-83ff-f80b93c83c2c/_ds_bundle.js"></script>
  <script src="../assets/ds-patches.js"></script>
</helmet>
<nav style="height: 100%; flex: none; display: flex; color: var(--text-primary);">
  <div style="width: 64px; flex: none; background: var(--bg-sunk); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 0; box-sizing: border-box;">
    <div title="COSX Advisory" style="width: 32px; height: 32px; border-radius: 8px; background: var(--yellow); color: var(--ink); display: grid; place-items: center; font-size: 13px; font-weight: 600; margin-bottom: 14px;"><img src="../assets/logo-icon.svg" alt="COSX" style="width: 78%; height: 78%; display: block;"></div>
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="8">
      <div title="{{ it.label }}" style="position: relative; width: 44px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: {{ it.bg }}; color: {{ it.fg }};"><x-import component-from-global-scope="COSXDesignSystem30_460d0b.Icon" name="{{ it.icon }}" size="{{ 18 }}" hint-size="18px,18px"></x-import><span style="position: absolute; top: 2px; right: 0; font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 999px; background: var(--yellow-accent); color: var(--ink); box-shadow: 0 0 0 2px var(--bg-sunk); display: {{ it.cd }};">{{ it.count }}</span></div>
    </sc-for>
    <div style="flex: 1;"></div>
    <div title="Agent" style="width: 44px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: var(--ink); color: var(--yellow-accent); margin-bottom: 8px;"><x-import component-from-global-scope="COSXDesignSystem30_460d0b.Icon" name="sparkles" size="{{ 18 }}" hint-size="18px,18px"></x-import></div>
    <span title="Sam Ortiz" style="width: 32px; height: 32px; border-radius: 999px; background: var(--bg-chrome); display: grid; place-items: center; font-size: 11px; font-weight: 600;">SO</span>
  </div>
  <div style="width: 248px; flex: none; background: var(--bg-page); border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 2px; padding: 16px 10px; box-sizing: border-box; overflow: hidden;">
    <sc-if value="{{ isInbox }}">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 8px 12px;"><span style="font-size: 15px; font-weight: 500;">{{ title }}</span><span style="display: inline-flex; color: var(--text-secondary);"><x-import component-from-global-scope="COSXDesignSystem30_460d0b.Icon" name="panel-left-close" size="{{ 16 }}" hint-size="16px,16px"></x-import></span></div>
      <div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; background: var(--bg-sunk); color: var(--text-secondary); font-size: 13px; margin-bottom: 4px;"><x-import component-from-global-scope="COSXDesignSystem30_460d0b.Icon" name="search" size="{{ 15 }}" hint-size="15px,15px"></x-import>{{ searchLabel }}<span style="margin-left: auto; font-size: 11px;">⌘K</span></div>
    </sc-if>
    <sc-if value="{{ isProject }}">
      <div style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; font-size: 13px; color: var(--text-secondary);"><x-import component-from-global-scope="COSXDesignSystem30_460d0b.Icon" name="arrow-left" size="{{ 14 }}" hint-size="14px,14px"></x-import>{{ backLabel }}</div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px; margin-bottom: 6px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--rule);"><span style="width: 28px; height: 28px; border-radius: 7px; background: var(--ink); color: var(--linen); display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none;">WF</span><div style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3;"><span style="font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ projName }}</span><span style="font-size: 11.5px; color: var(--text-secondary);">{{ projKind }}</span></div><x-import component-from-global-scope="COSXDesignSystem30_460d0b.Icon" name="chevrons-up-down" size="{{ 14 }}" hint-size="14px,14px"></x-import></div>
    </sc-if>
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="display: {{ g.ld }}; font-size: 12px; font-weight: 500; color: var(--text-secondary); padding: 14px 10px 4px;">{{ g.label }}</span>
        <sc-for list="{{ g.items }}" as="m" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 8px; background: {{ m.bg }}; color: {{ m.fg }}; font-size: 13px; font-weight: {{ m.w }};">
            <span style="display: {{ m.iconDisplay }}; flex: none;"><x-import component-from-global-scope="COSXDesignSystem30_460d0b.Icon" name="{{ m.icon }}" size="{{ 15 }}" hint-size="15px,15px"></x-import></span>
            <span style="display: {{ m.tileDisplay }}; width: 18px; height: 18px; border-radius: 5px; background: {{ m.tile }}; color: var(--ink); place-items: center; font-size: 9px; font-weight: 600; flex: none;">{{ m.ini }}</span>
            <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ m.label }}</span>
            <span style="font-size: 11px; font-weight: {{ m.countW }}; padding: 1px 6px; border-radius: 999px; background: {{ m.countBg }}; color: {{ m.countFg }}; display: {{ m.cd }};">{{ m.count }}</span>
          </div>
        </sc-for>
      </div>
    </sc-for>
    <div style="flex: 1;"></div>
    <sc-if value="{{ isProject }}">
      <div style="height: 1px; background: var(--rule-soft); margin: 6px 0;"></div>
      <sc-for list="{{ foot }}" as="m" hint-placeholder-count="2"><div style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 8px; font-size: 13px;"><x-import component-from-global-scope="COSXDesignSystem30_460d0b.Icon" name="{{ m.icon }}" size="{{ 15 }}" hint-size="15px,15px"></x-import>{{ m.label }}</div></sc-for>
    </sc-if>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 312, &quot;height&quot;: 800}, &quot;mode&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;inbox&quot;, &quot;project&quot;], &quot;default&quot;: &quot;inbox&quot;, &quot;tsType&quot;: &quot;'inbox' | 'project'&quot;}, &quot;lang&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;en&quot;, &quot;zh&quot;], &quot;default&quot;: &quot;en&quot;, &quot;tsType&quot;: &quot;'en' | 'zh'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const zh = this.props.lang === 'zh';
    const p = (en, z) => zh ? z : en;
    const mode = this.props.mode ?? 'inbox';
    const it = (label, o = {}) => {
      const on = !!o.on;
      return { label, icon: o.icon || 'dot', iconDisplay: o.icon ? 'inline-flex' : 'none', ini: o.ini || '', tile: o.tile || 'transparent', tileDisplay: o.ini ? 'grid' : 'none', count: o.count || '', cd: o.count ? 'inline-block' : 'none', countBg: o.hot ? 'var(--yellow-accent)' : 'transparent', countFg: o.hot ? 'var(--ink)' : (on ? 'rgba(17,17,17,.7)' : 'var(--text-secondary)'), countW: o.hot ? 600 : 500, bg: on ? 'var(--yellow)' : 'transparent', fg: on ? 'var(--ink)' : 'var(--text-primary)', w: on ? 500 : 400 };
    };
    const g = (label, items) => ({ label, ld: label ? 'block' : 'none', items });
    const groups = mode === 'project'
      ? [g('', [it(p('Overview', '概览'), { icon: 'layout-dashboard' }), it(p('Review', '审阅'), { icon: 'list-checks', count: '12', hot: true, on: true }), it(p('Parties', '当事人'), { icon: 'users' }), it(p('Applications', '申请'), { icon: 'file-check' }), it(p('Materials', '材料'), { icon: 'folder' }), it(p('Timeline', '时间线'), { icon: 'calendar' }), it(p('Pipeline', '流程'), { icon: 'workflow' })])]
      : [
        g('', [it(p('All open', '全部未关闭'), { icon: 'inbox', count: '12', on: true }), it(p('Assigned to me', '分配给我'), { icon: 'user', count: '5' }), it(p('Unassigned', '未分配'), { icon: 'user-round-x', count: '2', hot: true }), it(p('Waiting on us', '等我们处理'), { icon: 'clock', count: '5' }), it(p('Waiting on customer', '等客户'), { icon: 'hourglass', count: '4' }), it(p('Closed', '已关闭'), { icon: 'archive' })]),
        g(p('Customers', '客户'), [it('Halden Capital', { ini: 'H', tile: '#D6E4DA', count: '5' }), it('Vela Family Office', { ini: 'V', tile: '#E6DDF0', count: '2' }), it('Northgate LP', { ini: 'N', tile: '#DCE6F0', count: '1' }), it('Kowloon Bay Fund', { ini: 'K', tile: '#F0E0D6', count: '4' })])
      ];
    const defs = [['home', 'home', p('Home', '首页')], ['inbox', 'inbox', p('Inbox', '收件箱'), '12'], ['projects', 'briefcase', p('Projects', '项目')], ['docs', 'file-text', p('Documents', '文档')], ['agr', 'pen-line', p('Agreements', '协议')], ['cust', 'users', p('Customers', '客户')], ['matters', 'scale', p('Matters', '案件')], ['mkt', 'megaphone', p('Marketing', '营销')], ['admin', 'settings', p('Admin', '管理')]];
    const active = mode === 'project' ? 'projects' : 'inbox';
    return {
      isInbox: mode !== 'project', isProject: mode === 'project',
      title: p('Inbox', '收件箱'), searchLabel: p('Search', '搜索'),
      backLabel: p('All projects', '全部项目'),
      projName: p('Wang family · Global Talent', '王氏家庭 · 全球人才签证'), projKind: p('Matter · immigration', '案件 · 移民'),
      groups,
      foot: [['user-cog', p('Members & access', '成员与权限')], ['settings', p('Project settings', '项目设置')]].map(([icon, label]) => ({ icon, label })),
      items: defs.map(([k, icon, label, count]) => ({ icon, label, count: count || '', cd: count && k !== active ? 'inline-block' : 'none', bg: k === active ? 'var(--yellow)' : 'transparent', fg: k === active ? 'var(--ink)' : 'var(--text-primary)' }))
    };
  }
}
</script>
</body>
</html>
