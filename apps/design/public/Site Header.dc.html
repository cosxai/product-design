<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../_ds/cosx-design-system-3-0-460d0b48-000f-4361-83ff-f80b93c83c2c/styles.css">
  <script src="../_ds/cosx-design-system-3-0-460d0b48-000f-4361-83ff-f80b93c83c2c/_ds_bundle.js"></script>
  <script src="../assets/ds-patches.js"></script>
</helmet>
<header style="position: sticky; top: 0; z-index: 20; height: 64px; display: flex; align-items: center; gap: 20px; padding: 0 24px; background: var(--bg-page); border-bottom: 1px solid var(--rule); box-sizing: border-box; color: var(--text-primary); font-family: var(--font-sans-cjk);">
  <a href="/" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-primary); flex: none;"><span style="width: 30px; height: 30px; border-radius: 7px; background: #FFE3A0; display: grid; place-items: center;"><img src="../assets/logo-icon.svg" alt="" style="width: 78%; height: 78%; display: block;"></span><span style="font-size: 15px; font-weight: 500; white-space: nowrap;">COSX Design System</span></a>
  <nav style="display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);">
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="6"><a href="{{ i.href }}" title="{{ i.title }}" style="height: 34px; padding: 0 12px; display: inline-flex; align-items: center; border-radius: 8px; font-size: 13.5px; font-weight: 500; text-decoration: none; white-space: nowrap; background: {{ i.bg }}; color: {{ i.fg }};">{{ i.label }}</a></sc-for>
  </nav>
  <div style="flex: 1;"></div>
  <button type="button" onClick="{{ onLang }}" title="{{ langTitle }}" style="height: 34px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 8px; background: transparent; color: var(--text-primary); font-family: var(--font-sans-cjk); font-size: 13px; font-weight: 500; cursor: pointer; flex: none;">{{ langLabel }}</button>
  <button type="button" onClick="{{ onTheme }}" aria-label="{{ themeTitle }}" title="{{ themeTitle }}" style="width: 34px; height: 34px; border: 1px solid var(--rule); border-radius: 8px; background: transparent; color: var(--text-primary); display: grid; place-items: center; cursor: pointer; flex: none;"><x-import component-from-global-scope="COSXDesignSystem30_460d0b.Icon" name="{{ themeIcon }}" size="{{ 16 }}" hint-size="16px,16px"></x-import></button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:64},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;zh&quot;,&quot;en&quot;],&quot;default&quot;:&quot;zh&quot;,&quot;tsType&quot;:&quot;'zh' | 'en'&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light' | 'dark'&quot;},&quot;section&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;foundations&quot;,&quot;brand&quot;,&quot;components&quot;,&quot;patterns&quot;,&quot;templates&quot;,&quot;resources&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onLang&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() => void&quot;},&quot;onTheme&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() => void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const zh = (this.props.lang ?? 'zh') === 'zh', dark = this.props.theme === 'dark', sec = this.props.section ?? '';
    const defs = [['foundations', '基础', 'Foundations', '/colour'], ['brand', '品牌', 'Brand', '/logo'], ['components', '组件', 'Components', '/button'], ['patterns', '产品模式', 'Patterns', '/pattern-navigation'], ['templates', '页面模板', 'Templates', '/template-sign-in'], ['resources', '资源', 'Resources', '/downloads']];
    return {
      items: defs.map(([k, z, e, href]) => ({ label: zh ? z : e, href: href || '#', title: href ? '' : (zh ? '即将推出' : 'Coming soon'), bg: k === sec ? 'var(--brand-field, var(--yellow))' : 'transparent', fg: k === sec ? 'var(--ink)' : href ? 'var(--text-primary)' : 'var(--text-secondary)' })),
      langLabel: zh ? 'EN' : '中文', langTitle: zh ? 'Switch to English' : '切换到中文',
      themeIcon: dark ? 'sun' : 'moon', themeTitle: zh ? (dark ? '浅色' : '深色') : (dark ? 'Light' : 'Dark'),
      onLang: this.props.onLang, onTheme: this.props.onTheme
    };
  }
}
</script>
</body>
</html>
